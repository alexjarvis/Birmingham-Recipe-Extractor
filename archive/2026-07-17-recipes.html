<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>
    Birmingham Ink Recipes - July 17, 2026
  </title>
  <link rel="stylesheet" href="../template/styles.css" />
</head>
<body>
  <header>
    <div class="header-content">
      <div class="header-top">
        <div>
          <h1>
            Birmingham Ink Recipes
          </h1>
          <div class="header-date">
            Updated July 17, 2026
          </div>
        </div>
        <div class="header-actions">
          <div class="theme-toggle" id="themeToggle"></div>
          <a href="index.html" class="btn btn-icon" title="Archive">
            🗂️
          </a>
        </div>
      </div>
      <div class="stats-bar">
        <div class="stat">
          <div>
            <div class="stat-value">
              0
            </div>
            <div class="stat-label">
              Recipes
            </div>
          </div>
        </div>
        <div class="stat">
          <div>
            <div class="stat-value">
              0
            </div>
            <div class="stat-label">
              Ingredients
            </div>
          </div>
        </div>
        <div class="stat">
          <div>
            <div class="stat-value">
              0%
            </div>
            <div class="stat-label">
              Captured
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>
  <main>
    <div class="controls">
      <div class="controls-grid">
        <div class="search-wrapper">
          <span class="search-icon">
            🔍
          </span>
          <input type="text" class="search-input" placeholder="Search recipes by name or ingredient..." id="searchInput" />
        </div>
        <div class="view-toggle">
          <button class="view-btn" data-view="cards">
            Cards
          </button>
          <button class="view-btn active" data-view="table">
            Table
          </button>
        </div>
      </div>
    </div>
    <div class="filter-section">
      <div class="filter-title">
        Filter by Ingredient
      </div>
      <div class="filter-pills"></div>
    </div>
    <div id="cardView" class="card-grid hidden"></div>
    <div id="tableView" class="table-wrapper">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th class="sortable">
                Product
              </th>
            </tr>
          </thead>
          <tbody></tbody>
          <tfoot>
            <tr>
              <td>
                Recipe Count
              </td>
            </tr>
            <tr>
              <td>
                Quantity Count
              </td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </main>
  <script src="../template/script.js"></script>
</body>
