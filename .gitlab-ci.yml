---
stages:
  - sync
  - lint
  - test
  - build
  - deploy

# =============================================================================
# GITHUB SYNC
# =============================================================================
# Requires CI/CD variable:
#   - GITHUB_URL: https://alexjarvis:<TOKEN>@github.com/alexjarvis/birmingham-recipe-extractor.git

# Pull main and gh-pages from GitHub (scheduled daily)
sync-from-github:
  stage: sync
  image: alpine/git
  script:
    - git config --global user.email "gitlab-ci@rivendell.fivedigitinteger.com"
    - git config --global user.name "GitLab CI"
    - git remote add github "${GITHUB_URL}" || true
    - git fetch github main gh-pages
    - git fetch origin main gh-pages || true
    - |
      # Check main branch (fast-forward only: GitLab is normally the source of
      # truth, push-main-to-github mirrors to GitHub. Only sync the reverse
      # direction if GitHub is strictly ahead, never if GitLab is ahead or
      # branches have diverged.)
      LOCAL_MAIN=$(git rev-parse origin/main 2>/dev/null || echo "none")
      REMOTE_MAIN=$(git rev-parse github/main 2>/dev/null || echo "none")
      echo "GitLab main: $LOCAL_MAIN"
      echo "GitHub main: $REMOTE_MAIN"
      if [ "$LOCAL_MAIN" = "$REMOTE_MAIN" ]; then
        echo "main: No changes"
      elif git merge-base --is-ancestor "$LOCAL_MAIN" "$REMOTE_MAIN"; then
        echo "main: GitHub is ahead - fast-forwarding GitLab"
        git checkout -B main github/main
        git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" main
      elif git merge-base --is-ancestor "$REMOTE_MAIN" "$LOCAL_MAIN"; then
        echo "main: GitLab is ahead of GitHub - skipping (push-main-to-github will mirror)"
      else
        echo "main: BRANCHES DIVERGED - manual intervention required" >&2
        exit 1
      fi
    - |
      # Check gh-pages branch
      LOCAL_PAGES=$(git rev-parse origin/gh-pages 2>/dev/null || echo "none")
      REMOTE_PAGES=$(git rev-parse github/gh-pages 2>/dev/null || echo "none")
      echo "GitLab gh-pages: $LOCAL_PAGES"
      echo "GitHub gh-pages: $REMOTE_PAGES"
      if [ "$LOCAL_PAGES" != "$REMOTE_PAGES" ]; then
        echo "gh-pages: Changes detected - updating GitLab"
        git checkout -B gh-pages github/gh-pages
        git push -f "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" gh-pages
        echo "PAGES_CHANGED=true" >> sync.env
      else
        echo "gh-pages: No changes"
        echo "PAGES_CHANGED=false" >> sync.env
      fi
  artifacts:
    reports:
      dotenv: sync.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Rebuild pages if gh-pages was updated
pages-after-sync:
  stage: deploy
  image: alpine:latest
  needs:
    - job: sync-from-github
      artifacts: true
  script:
    - apk add --no-cache git
    - git fetch origin gh-pages
    - git checkout origin/gh-pages -- .
    - mkdir -p public
    - cp -r archive images index.html template .nojekyll public/ 2>/dev/null || true
    - ls -la public/
  artifacts:
    paths:
      - public
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $PAGES_CHANGED == "true"

# Push main to GitHub (on commits to main)
push-main-to-github:
  stage: deploy
  image: alpine/git
  script:
    - git remote add github "${GITHUB_URL}" || true
    - git push github HEAD:main
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule"
  allow_failure: true  # Don't fail pipeline if GitHub push fails

# =============================================================================
# REGULAR CI/CD JOBS
# =============================================================================
php-syntax:
  stage: lint
  image: php:8.3-cli-alpine
  script:
    - find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

phpunit:
  stage: test
  image: php:8.3-cli-alpine
  before_script:
    - apk add --no-cache curl git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist
  script:
    - ./vendor/bin/phpunit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Docker build using Docker-in-Docker
docker-build:
  stage: build
  image: docker:24.0
  services:
    - name: docker:24.0-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    # Wait for Docker daemon to be ready
    - for i in $(seq 1 30); do docker info && break || sleep 2; done
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    # Push to registry if configured
    - if [ -n "$CI_REGISTRY_USER" ]; then
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY;
        docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA;
        docker push $CI_REGISTRY_IMAGE:latest;
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# GitLab Pages deployment - mirrors GitHub Pages from gh-pages branch
pages:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache git
    - git fetch origin gh-pages
    - git checkout origin/gh-pages -- .
    - mkdir -p public
    - cp -r archive images index.html template .nojekyll public/ 2>/dev/null || true
    - ls -la public/
  artifacts:
    paths:
      - public
    expire_in: 1 hour  # Only keep latest; new deployment replaces old
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
